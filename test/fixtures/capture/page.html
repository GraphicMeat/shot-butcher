<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
  body { margin: 0; font: 17px/1.4 system-ui, sans-serif; background: #f2f2f7; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  header { padding: 60px 20px 12px; font-size: 32px; font-weight: 700; }
  li { list-style: none; margin: 8px 16px; padding: 14px; border-radius: 12px; background: rgba(127,127,127,.15); }
  .detail { display: none; padding: 20px; } body.open .detail { display: block; } body.open ul { display: none; }
</style></head>
<body>
  <header>Fixture</header>
  <ul><li id="first">First item</li><li>Second item</li><li>Third item</li></ul>
  <div class="detail">Detail view for the first item.</div>
  <script>document.getElementById('first').onclick = () => document.body.classList.add('open');</script>
</body></html>
