<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shot-butcher canvas</title>
<link rel="stylesheet" href="/engine/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  #canvas { position: relative; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--font-text); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  #canvas img { display: block; }
  #error { color: #f55; font: 24px monospace; padding: 24px; white-space: pre-wrap; }
</style>
<style id="style-css"></style>
</head>
<body>
<div id="canvas"></div>
<script type="module" src="/engine/main.js"></script>
</body>
</html>
